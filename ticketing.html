<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プライオリティパス発券</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body { font-family:sans-serif; background:#f0f4f8; padding:20px; }
h1 { text-align:center; }

form { max-width:340px; margin:auto; background:#fff; padding:20px; border-radius:12px; }
input,select,button { width:100%; margin:8px 0; padding:10px; }

.ticket-card {
  max-width:360px; margin:20px auto; padding:20px;
  background:#fff; border-radius:16px; text-align:center;
  border:2px solid #009933;
}

/* モーダル */
.modal {
  display:none; position:fixed; top:0; left:0;
  width:100%; height:100%; background:rgba(0,0,0,0.6);
}
.modal-content {
  background:#fff; margin:20% auto; padding:20px;
  max-width:300px; border-radius:10px;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  doc, getDoc, setDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIza...",
  authDomain:"fastpass-system.firebaseapp.com",
  projectId:"fastpass-system"
});
const db = getFirestore(app);

/* ===== 日付キー ===== */
function todayKey(){
  return new Date().toISOString().slice(0,10);
}

/* ===== 正規化（ズレ防止） ===== */
function normalize(str){
  return (str||"").replace(/\s/g,"");
}

/* ===== 4桁ID ===== */
async function generatePassId(){
  const key=todayKey();
  const ref=doc(db,"counters",key);

  const snap=await getDoc(ref);
  let num=0;

  if(snap.exists()) num=snap.data().count || 0;

  num++;

  await setDoc(ref,{count:num});

  return num.toString().padStart(4,"0");
}

/* ===== 時間生成 ===== */
function generateTimeBlocks(start,end,interval){
  const blocks=[];
  let [sh,sm]=start.split(":").map(Number);
  let [eh,em]=end.split(":").map(Number);

  let s=new Date(); s.setHours(sh,sm,0,0);
  let e=new Date(); e.setHours(eh,em,0,0);

  while(s<e){
    let next=new Date(s.getTime()+interval*60000);
    if(next>e) break;

    const pad=n=>n.toString().padStart(2,"0");

    blocks.push(`${pad(s.getHours())}:${pad(s.getMinutes())}〜${pad(next.getHours())}:${pad(next.getMinutes())}`);
    s=next;
  }
  return blocks;
}

/* ===== チケット表示（修正版） ===== */
function renderTicket(data){
  const el=document.getElementById("qrcode");
  el.innerHTML="";

  const card=document.createElement("div");
  card.className="ticket-card";

  card.innerHTML=`
    <h2>プライオリティパス</h2>
    <p>ID：${data.id}</p>
    <p>${data.time}</p>
    <p>${data.name}</p>
    <p>${data.people}人</p>
  `;

  const qrDiv=document.createElement("div");
  card.appendChild(qrDiv);

  el.appendChild(card);

  new QRCode(qrDiv,{
    text:JSON.stringify(data),
    width:200,
    height:200
  });
}

/* ===== UI更新 ===== */
function updateUI(passes,slots,limits){

  const select=document.getElementById("timeSelect");
  select.innerHTML="";

  const nowTime=new Date().toTimeString().slice(0,5);

  let has=false;

  slots.forEach((slot,i)=>{

    const start=slot.split("〜")[0];
    if(start < nowTime) return;

    const count=passes.filter(p=>{
      return normalize(p.time) === normalize(slot);
    }).length;

    const remain=(limits[i]||1)-count;

    if(remain<=0) return;

    const opt=document.createElement("option");
    opt.value=slot;
    opt.textContent=`${slot}（残り${remain}枚）`;

    select.appendChild(opt);
    has=true;
  });

  if(!has){
    document.getElementById("form").style.display="none";
    document.getElementById("info").innerText="本日は終了";
  }
}

/* ===== 初期 ===== */
window.addEventListener("load",()=>{

  const form=document.getElementById("form");

  /* 🔥 既存チケット */
  const saved=localStorage.getItem("ticket");
  if(saved){
    const data=JSON.parse(saved);
    if(data.date===todayKey()){
      form.style.display="none";
      renderTicket(data);
      return;
    }
  }

  let passes=[];
  let slots=[];
  let limits=[];

  /* Firestore監視 */
  onSnapshot(collection(db,"passes"),snap=>{
    passes=snap.docs.map(d=>d.data());
    updateUI(passes,slots,limits);
  });

  onSnapshot(doc(db,"settings","timeSlots"),snap=>{
    const data=snap.data();

    slots=[]; limits=[];

    data?.slots?.forEach(f=>{
      const gen=generateTimeBlocks(f.start,f.end,Number(f.interval)||10);
      gen.forEach(g=>{
        slots.push(g);
        limits.push(Number(f.limit)||1);
      });
    });

    updateUI(passes,slots,limits);
  });

  /* 発券 → モーダル */
  form.addEventListener("submit",(e)=>{
    e.preventDefault();
    document.getElementById("modal").style.display="block";
  });

  document.getElementById("cancelBtn").onclick=()=>{
    document.getElementById("modal").style.display="none";
  };

  document.getElementById("okBtn").onclick=async ()=>{

    const name=document.getElementById("name").value;
    const people=document.getElementById("people").value;
    const time=document.getElementById("timeSelect").value;

    const id=await generatePassId();

    const data={
      id,name,people,time,
      date:todayKey()
    };

    await addDoc(collection(db,"passes"),{
      ...data,
      createdAt:serverTimestamp()
    });

    localStorage.setItem("ticket",JSON.stringify(data));

    document.getElementById("modal").style.display="none";
    form.style.display="none";

    renderTicket(data);
  };

});
</script>
</head>

<body>

<h1>プライオリティパス発券</h1>

<form id="form">
  <input id="name" placeholder="名前" required>
  <input id="people" type="number" placeholder="人数" required>
  <select id="timeSelect"></select>
  <button>発券する</button>
</form>

<div id="info"></div>
<div id="qrcode"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <p>発券しますか？</p>
    <button id="okBtn">はい</button>
    <button id="cancelBtn">いいえ</button>
  </div>
</div>

</body>
</html>
