<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プライオリティパス発券</title>

<!-- QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body { font-family: "Segoe UI", sans-serif; background:#f0f4f8; margin:0; padding:20px; }
h1 { text-align:center; color:#004080; }

form {
  max-width:340px; margin:0 auto 20px; padding:20px;
  background:#fff; border-radius:12px;
}

input, select, button {
  width:100%; padding:10px; margin:8px 0;
}

button { background:#0066cc; color:#fff; border:none; }

.ticket-card {
  max-width:360px; margin:20px auto; padding:20px;
  background:#fff; border-radius:16px;
  text-align:center;
  border:2px solid #009933;
}

/* モーダル */
.modal {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
}
.modal-content {
  background:#fff;
  margin:20% auto;
  padding:20px;
  max-width:300px;
  border-radius:10px;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc,
  onSnapshot, serverTimestamp, getDocs, getDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIza...",
  authDomain:"fastpass-system.firebaseapp.com",
  projectId:"fastpass-system"
});
const db = getFirestore(app);

/* =====================
   日付キー
===================== */
function getTodayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

/* =====================
   4桁ID
===================== */
async function generatePassID(){
  const ref=doc(db,"settings","counter");
  const snap=await getDoc(ref);

  let val=0;
  if(snap.exists()) val=snap.data().value||0;

  await updateDoc(ref,{value:val+1});

  return String(val).padStart(4,"0");
}

/* =====================
   時間生成
===================== */
function generateTimeBlocks(start,end,interval){
  const list=[];
  let [h,m]=start.split(":").map(Number);
  const [eh,em]=end.split(":").map(Number);

  while(h<eh || (h===eh && m<em)){
    let nh=h, nm=m+interval;
    if(nm>=60){ nh++; nm-=60; }

    const pad=n=>String(n).padStart(2,"0");
    list.push(`${pad(h)}:${pad(m)}〜${pad(nh)}:${pad(nm)}`);

    h=nh; m=nm;
  }
  return list;
}

/* =====================
   QR表示
===================== */
function renderTicket(data){
  const el=document.getElementById("qrcode");
  el.innerHTML="";

  const card=document.createElement("div");
  card.className="ticket-card";

  card.innerHTML=`
    <h2>プライオリティパス</h2>
    <p>ID：${data.id}</p>
    <p>${data.time}</p>
    <p>${data.name}</p>
    <p>${data.people}人</p>
    <div id="qr"></div>
  `;

  el.appendChild(card);

  new QRCode(card.querySelector("#qr"),{
    text:JSON.stringify(data),
    width:200,
    height:200
  });

  document.getElementById("form").style.display="none";
}

/* =====================
   制限チェック
===================== */
async function checkLimit(){
  const snap=await getDoc(doc(db,"settings","timeSlots"));
  const slot=snap.data()?.slots?.[0];
  if(!slot) return {ok:true};

  const interval=Number(slot.interval)||10;
  const limit=Number(slot.limit)||1;

  const now=Date.now();
  const since=new Date(now-interval*60000);

  const passes=await getDocs(collection(db,"passes"));

  let count=0;
  passes.forEach(d=>{
    const t=d.data().createdAt;
    if(t && t.toDate()>=since) count++;
  });

  return {ok:count<limit};
}

/* =====================
   UI更新
===================== */
async function updateUI(passes,slots,limits){

  const select=document.getElementById("timeSelect");
  const now=new Date().toTimeString().slice(0,5);

  select.innerHTML="";
  let has=false;

  slots.forEach((s,i)=>{
    const start=s.split("〜")[0];
    if(start<now) return;

    const count=passes.filter(p=>p.time===s).length;
    const remain=(limits[i]||1)-count;

    if(remain<=0) return;

    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=`${s}（残${remain}）`;

    select.appendChild(opt);
    has=true;
  });

  if(!has){
    document.getElementById("form").style.display="none";
    document.getElementById("info").innerHTML="終了";
  }
}

/* =====================
   初期化
===================== */
window.addEventListener("load",()=>{

  const todayKey=getTodayKey();
  const saved=localStorage.getItem("ticket_"+todayKey);
  if(saved){
    renderTicket(JSON.parse(saved));
    return;
  }

  const passesCol=collection(db,"passes");
  const timeSlotsDoc=doc(db,"settings","timeSlots");

  let passes=[];
  let slots=[];
  let limits=[];

  onSnapshot(passesCol,s=>{
    passes=s.docs.map(d=>d.data());
    updateUI(passes,slots,limits);
  });

  onSnapshot(timeSlotsDoc,s=>{
    slots=[]; limits=[];

    s.data()?.slots?.forEach(f=>{
      const list=generateTimeBlocks(f.start,f.end,Number(f.interval)||10);
      list.forEach(l=>{
        slots.push(l);
        limits.push(Number(f.limit)||1);
      });
    });

    updateUI(passes,slots,limits);
  });

  /* モーダル */
  const modal=document.getElementById("modal");

  document.getElementById("form").addEventListener("submit",(e)=>{
    e.preventDefault();
    modal.style.display="block";
  });

  document.getElementById("cancel").onclick=()=>modal.style.display="none";

  document.getElementById("ok").onclick=async()=>{

    const name=document.getElementById("name").value;
    const people=document.getElementById("people").value;
    const time=document.getElementById("timeSelect").value;

    const todayKey=getTodayKey();
    if(localStorage.getItem("ticket_"+todayKey)){
      renderTicket(JSON.parse(localStorage.getItem("ticket_"+todayKey)));
      modal.style.display="none";
      return;
    }

    const check=await checkLimit();
    if(!check.ok){
      alert("制限中");
      return;
    }

    const id=await generatePassID();

    const data={id,name,people,time};

    await addDoc(collection(db,"passes"),{
      ...data,
      createdAt:serverTimestamp()
    });

    localStorage.setItem("ticket_"+todayKey,JSON.stringify(data));

    renderTicket(data);
    modal.style.display="none";
  };

});
</script>
</head>

<body>

<h1>プライオリティパス発券</h1>

<form id="form">
  <input id="name" placeholder="名前" required>
  <input id="people" type="number" placeholder="人数" required>
  <select id="timeSelect"></select>
  <button>発券する</button>
</form>

<div id="info"></div>
<div id="qrcode"></div>

<!-- モーダル -->
<div id="modal" class="modal">
  <div class="modal-content">
    <p>発券しますか？</p>
    <button id="ok">OK</button>
    <button id="cancel">キャンセル</button>
  </div>
</div>

</body>
</html>
